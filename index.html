<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitNit - Personal Tracker</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Link to the Manifest -->
<link rel="manifest" href="manifest.json">

<!-- Mobile Theme Color -->
<meta name="theme-color" content="#2c3e50">

<!-- iOS Home Screen Icon -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

    <!-- App Header -->
    <header>
        <h1 id="view-title">FitNit</h1>
        <button id="logout-btn" style="display:none;">Logout</button>
    </header>

    <!-- Main Content Area -->
<main id="app">
    <!-- Tab 1: Home (Highlights) -->
    <section id="dashboard-screen" class="view">
        <div class="card highlight-card">
            <h3>Today's Progress</h3>
            <div class="stat-grid">
                <div><small>Cals</small><p id="dash-cals">0/0</p></div>
                <div><small>Protein</small><p id="dash-prot">0g</p></div>
                <div><small>Weight</small><p id="dash-weight">--</p></div>
            </div>
        </div>
        <button onclick="showView('scanner-screen')" class="fab">+ Scan Food</button>
    </section>

    <!-- Tab 2: Nutrition Stats -->
    <section id="nutrition-screen" class="view" style="display:none;">
        <div class="card">
            <h3>Macro Summary</h3>
            <canvas id="macroChart"></canvas>
            <div id="macro-details"></div>
        </div>
    </section>

    <!-- Tab 3: History/Log -->
    <section id="history-screen" class="view" style="display:none;">
        <div class="filter-bar">
            <button onclick="loadHistory('day')">Day</button>
            <button onclick="loadHistory('week')">Week</button>
            <button onclick="loadHistory('month')">Month</button>
        </div>
        <div id="history-list"></div>
    </section>

    <!-- Tab 4: Weight Tracker -->
    <section id="weight-screen" class="view" style="display:none;">
        <div class="card">
            <h3>Weight Journey</h3>
            <canvas id="weightHistoryChart"></canvas>
            <input type="number" id="new-weight" placeholder="Log Today's Weight">
            <button id="btn-save-weight">Log Weight</button>
        </div>
    </section>

    <!-- Tab 5: Profile & Goals -->
    <section id="profile-screen" class="view" style="display:none;">
        <div class="card">
            <h3>Personal Info</h3>
            <input type="number" id="p-height" placeholder="Height (cm)">
            <input type="number" id="p-age" placeholder="Age">
            <select id="p-gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <select id="p-activity">
                <option value="1.2">Sedentary</option>
                <option value="1.55">Moderate Activity</option>
                <option value="1.9">Heavy Athlete</option>
            </select>
            <button id="save-profile-btn">Recalculate Goals</button>
        </div>
        <div class="card" id="goal-summary">
            <!-- Calculated goals appear here -->
        </div>
    </section>
</main>

    <!-- Bottom Navigation -->
<nav class="bottom-nav">
    <button onclick="showView('dashboard-screen')"><i class="material-icons">home</i></button>
    <button onclick="showView('nutrition-screen')"><i class="material-icons">pie_chart</i></button>
    <button onclick="showView('history-screen')"><i class="material-icons">assignment</i></button>
    <button onclick="showView('weight-screen')"><i class="material-icons">show_chart</i></button>
    <button onclick="showView('profile-screen')"><i class="material-icons">settings</i></button>
</nav>

    <!-- App Logic -->
    <script type="module" src="app.js"></script>
</body>
</html>
