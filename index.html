<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitNit Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="manifest" href="manifest.json?v=3">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="FitNitAppIcon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

    <header>
        <h1 id="view-title">FitNit</h1>
        <button id="logout-btn" style="display:none; width:auto;">Logout</button>
    </header>

    <main id="app">
        <!-- AUTH -->
        <section id="auth-screen" class="view">
            <div class="card">
                <h2>Welcome</h2>
                <input type="email" id="email" placeholder="Email">
                <input type="password" id="password" placeholder="Password">
                <button id="login-click">Login</button>
                <button id="register-click" style="background:#27ae60">Register</button>
            </div>
        </section>

        <!-- DASHBOARD (HOME) -->
        <section id="dashboard-screen" class="view" style="display:none;">
            <div class="card highlight-grid">
                <div class="stat-box"><small>CALORIES</small><p id="dash-cals">0/0</p></div>
                <div class="stat-box"><small>PROTEIN</small><p id="dash-prot">0/0g</p></div>
                <div class="stat-box"><small>WEIGHT</small><p id="dash-weight">--</p></div>
            </div>
            <div id="today-meal-list"></div>
        </section>

        <!-- NUTRITION -->
        <section id="nutrition-screen" class="view" style="display:none;">
            <div class="card">
                <h3>Macro Balance</h3>
                <canvas id="macroChart"></canvas>
            </div>
        </section>

        <!-- WEIGHT -->
        <section id="weight-screen" class="view" style="display:none;">
            <div class="card"><canvas id="weightHistoryChart"></canvas></div>
            <div class="card">
                <input type="number" id="weight-input" placeholder="Weight (lbs)">
                <button id="save-weight-btn">Log Weight</button>
                <button id="export-pdf-btn" style="background:#8e44ad">Export PDF</button>
            </div>
        </section>

<!-- WORKOUT SCREEN -->
<section id="workout-screen" class="view" style="display:none;">
    <div class="card highlight-grid">
        <div class="stat-box"><small>BURNED TODAY</small><p id="dash-burned">0 kcal</p></div>
        <div class="stat-box"><small>NET CALS</small><p id="dash-net">0</p></div>
    </div>

    <div class="card">
        <div class="filter-bar" style="display:flex; gap:10px;">
            <button onclick="window.setWorkoutMode('strength')">Strength</button>
            <button onclick="window.setWorkoutMode('cardio')">Cardio</button>
        </div>
    </div>

    <!-- Add Strength -->
    <div id="add-strength" class="card" style="display:none;">
        <div style="position:relative;">
            <input type="text" id="ex-name" placeholder="Exercise (e.g. Bench Press)" autocomplete="off">
            <div id="ex-suggestions" class="suggestions-list" style="display:none;"></div>
        </div>
        <div class="highlight-grid">
            <input type="number" id="ex-sets" placeholder="Sets">
            <input type="number" id="ex-reps" placeholder="Reps">
            <input type="number" id="ex-weight" placeholder="Lbs">
        </div>
        <button id="btn-save-strength">Log Sets</button>
    </div>

    <!-- Add Cardio -->
    <div id="add-cardio" class="card" style="display:none;">
        <select id="cardio-type">
            <option value="8">Running (approx 5mph)</option>
            <option value="10">Running (fast)</option>
            <option value="3.5">Walking</option>
            <option value="7">Cycling</option>
            <option value="9">Elliptical</option>
        </select>
        <div class="highlight-grid">
            <input type="number" id="car-time" placeholder="Mins">
            <input type="number" id="car-speed" placeholder="MPH">
        </div>
        <button id="btn-save-cardio">Log Cardio</button>
    </div>

    <div id="workout-list-daily"></div>
</section>
        

        <!-- PROFILE -->
        <section id="profile-screen" class="view" style="display:none;">
            <div class="profile-header">
                <h2>Health Summary</h2>
                <button id="open-settings-btn" class="icon-btn"><i class="material-icons">settings</i></button>
            </div>
            <div class="dashboard-grid">
                <div class="card widget"><small>BMI</small><h2 id="summary-bmi">--</h2><p id="summary-bmi-text">--</p></div>
                <div class="card widget"><small>PROGRESS</small><h2 id="summary-weight-diff">--</h2><p>Total Lbs</p></div>
                <div class="card widget"><small>DAILY GOAL</small><h2 id="summary-goal-status">0%</h2><p>Consumed</p></div>
            </div>
            <div class="card">
                <h3>Macros</h3>
                <div class="macro-bar-container">
                    <span>Protein</span><div class="progress"><div id="bar-prot" class="fill"></div></div>
                    <span>Carbs</span><div class="progress"><div id="bar-carb" class="fill"></div></div>
                    <span>Fats</span><div class="progress"><div id="bar-fat" class="fill"></div></div>
                </div>
            </div>
        </section>

        <!-- ADD FOOD -->
        <section id="scanner-screen" class="view" style="display:none;">
            <div class="card">
                <div class="filter-bar" style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
                    <button onclick="window.toggleAddMode('scan')">Scan</button>
                    <button onclick="window.toggleAddMode('search')">Search</button>
                    <button onclick="window.toggleAddMode('favs')">★ Favs</button>
                    <button onclick="window.toggleAddMode('recent')">Recent</button>
                    <button onclick="window.toggleAddMode('custom')" style="grid-column: span 2;">Custom Entry</button>
                </div>
            </div>

            <div id="mode-scan"><div id="reader"></div></div>
            <div id="mode-search" style="display:none;">
                <div class="card">
                    <input type="text" id="search-input" placeholder="Search...">
                    <button id="btn-execute-search">Go</button>
                    <div id="search-results-list" class="list-container"></div>
                </div>
            </div>
            <div id="mode-recent" style="display:none;"><div id="recent-list" class="list-container"></div></div>
            <div id="mode-favs" style="display:none;"><div id="favs-list" class="list-container"></div></div>
            <div id="mode-custom" style="display:none;">
                <div class="card">
                    <input type="text" id="c-name" placeholder="Name *">
                    <input type="number" id="c-cals" placeholder="Calories">
                    <button id="btn-submit-custom">Save Custom</button>
                </div>
            </div>

            <div id="scanned-result" class="card" style="display:none; border: 2px solid #3498db;">
                <h4 id="food-name">Product</h4>
                <p id="food-info"></p>
                <select id="meal-type">
                    <option value="breakfast">Breakfast</option>
                    <option value="lunch">Lunch</option>
                    <option value="dinner">Dinner</option>
                    <option value="snack">Snack</option>
                </select>
                <button id="add-food-btn">Add to Diary</button>
            </div>
        </section>
    </main>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content card">
            <div class="modal-header"><h3>Settings</h3><button id="close-settings-btn" class="icon-btn"><i class="material-icons">close</i></button></div>
            <div class="settings-row"><span>Dark Mode</span><input type="checkbox" id="dark-mode-toggle" style="width:auto;"></div>
            <div class="settings-row"><span>Invite</span><button id="share-app-btn" style="width:auto; padding:5px 15px;">Share</button></div>
            <hr>
            <input type="number" id="p-height" placeholder="Height (cm)">
            <input type="number" id="p-age" placeholder="Age">
            <select id="p-gender"><option value="male">Male</option><option value="female">Female</option></select>
            <select id="p-activity"><option value="1.2">Sedentary</option><option value="1.55">Moderate</option><option value="1.9">Athlete</option></select>
            <button id="save-profile-btn">Recalculate Goals</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <button onclick="window.showView('dashboard-screen')"><i class="material-icons">home</i></button>
        <button id="scan-nav-btn"><i class="material-icons">add_box</i></button>
        <button onclick="window.showView('weight-screen')"><i class="material-icons">show_chart</i></button>
        <button onclick="window.showView('profile-screen')"><i class="material-icons">person</i></button>
        <button onclick="window.showView('workout-screen')"><i class="material-icons">fitness_center</i></button>
    </nav>

    <script type="module" src="app.js"></script>
</body>
</html>
