<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitNit - Personal Tracker</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Link to the Manifest -->
<link rel="manifest" href="manifest.json">

<!-- Mobile Theme Color -->
<meta name="theme-color" content="#2c3e50">

<!-- iOS Home Screen Icon -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

    <!-- App Header -->
    <header>
        <h1 id="view-title">FitNit</h1>
        <button id="logout-btn" style="display:none;">Logout</button>
    </header>

    <!-- Main Content Area -->
    <main id="app">
        <!-- Auth Screen -->
        <section id="auth-screen" class="view">
            <div class="card">
                <h2>Welcome</h2>
                <input type="email" id="email" placeholder="Email">
                <input type="password" id="password" placeholder="Password">
                <button id="login-click">Login</button>
                <button id="register-click" style="background: #27ae60;">Register</button>
            </div>
        </section>

        <!-- Dashboard / Summary Screen -->
        <section id="dashboard-screen" class="view" style="display:none;">
            <div class="card">
                <h3>Today's Calories</h3>
                <p id="daily-cal-total" style="font-size: 1.5rem; font-weight: bold;">0 / 2000 kcal</p>
            </div>
            <div class="card">
                <h3>Weight Progress</h3>
                <canvas id="weightChart"></canvas>
            </div>
            <div class="card">
                <h3>Log Daily Weight</h3>
                <input type="number" id="weight-input" placeholder="Weight (lbs)">
                <button id="save-weight-btn">Save Weight</button>
                <button id="export-pdf-btn" style="background:#8e44ad;">Export PDF for Doctor</button>
            </div>
        </section>

        <!-- Barcode Scanner Screen -->
        <section id="scanner-screen" class="view" style="display:none;">
            <div class="card">
                <div id="reader" style="width: 100%;"></div>
            </div>
            <div id="scanned-result" class="card" style="display:none;">
                <img id="food-img" src="" alt="food" style="width:80px; display:block; margin:auto;">
                <h4 id="food-name">Product Name</h4>
                <p id="food-cals">0 kcal</p>
                <select id="meal-type">
                    <option value="breakfast">Breakfast</option>
                    <option value="lunch">Lunch</option>
                    <option value="dinner">Dinner</option>
                    <option value="snack">Snack</option>
                </select>
                <button id="add-food-btn">Add to Diary</button>
            </div>
        </section>

        <!-- Profile / Social Screen -->
        <section id="profile-screen" class="view" style="display:none;">
            <div class="card">
                <h3>Privacy Settings</h3>
                <p>Choose who can see your progress:</p>
                <select id="privacy-status">
                    <option value="private">Private</option>
                    <option value="friends">Friends Only</option>
                    <option value="public">Public</option>
                </select>
                <button id="save-profile">Save Profile</button>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button id="nav-dash"><i class="material-icons">dashboard</i></button>
        <button id="nav-scan"><i class="material-icons">qr_code_scanner</i></button>
        <button id="nav-prof"><i class="material-icons">person</i></button>
    </nav>

    <!-- App Logic -->
    <script type="module" src="app.js"></script>
</body>
</html>
