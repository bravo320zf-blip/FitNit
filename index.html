<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitNit Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <header>
        <h1 id="view-title">FitNit</h1>
        <button id="logout-btn" style="display:none; width:auto;">Logout</button>
    </header>

    <main id="app">
        <!-- AUTH -->
        <section id="auth-screen" class="view">
            <div class="card">
                <h2>Login / Register</h2>
                <input type="email" id="email" placeholder="Email">
                <input type="password" id="password" placeholder="Password">
                <button id="login-click">Login</button>
                <button id="register-click" style="background:#27ae60">Register</button>
            </div>
        </section>

        <!-- DASHBOARD (HOME) -->
        <section id="dashboard-screen" class="view" style="display:none;">
            <div class="card highlight-grid">
                <div class="stat-box">
                    <small>CALORIES</small>
                    <p id="dash-cals">0 / 0</p>
                </div>
                <div class="stat-box">
                    <small>PROTEIN</small>
                    <p id="dash-prot">0 / 0g</p>
                </div>
                <div class="stat-box">
                    <small>WEIGHT</small>
                    <p id="dash-weight">-- lbs</p>
                </div>
            </div>
            <div class="card">
                <h3>Today's Meals</h3>
                <div id="today-meal-list"></div>
            </div>
        </section>

        <!-- NUTRITION (STATS) -->
        <section id="nutrition-screen" class="view" style="display:none;">
            <div class="card">
                <h3>Macro Balance</h3>
                <canvas id="macroChart"></canvas>
            </div>
        </section>

        <!-- HISTORY (LOG) -->
        <section id="history-screen" class="view" style="display:none;">
            <div class="filter-bar">
                <button onclick="window.loadHistory('day')">Day</button>
                <button onclick="window.loadHistory('week')">Week</button>
            </div>
            <div id="history-list"></div>
        </section>

        <!-- WEIGHT (GRAPH) -->
        <section id="weight-screen" class="view" style="display:none;">
            <div class="card">
                <canvas id="weightHistoryChart"></canvas>
            </div>
            <div class="card">
                <input type="number" id="weight-input" placeholder="Current Weight">
                <button id="save-weight-btn">Log Weight</button>
                <button id="export-pdf-btn" style="background:#8e44ad">Export PDF</button>
            </div>
        </section>

        <!-- PROFILE (GOALS) -->
        <section id="profile-screen" class="view" style="display:none;">
            <div class="card">
                <h3>Settings & Goals</h3>
                <label>Height (cm)</label>
                <input type="number" id="p-height" placeholder="175">
                <label>Age</label>
                <input type="number" id="p-age" placeholder="30">
                <label>Gender</label>
                <select id="p-gender">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
                <label>Activity Level</label>
                <select id="p-activity">
                    <option value="1.2">Sedentary</option>
                    <option value="1.55">Moderate</option>
                    <option value="1.9">Athlete</option>
                </select>
                <button id="save-profile-btn">Recalculate Goals</button>
            </div>
        </section>

        <!-- SCANNER -->
        <section id="scanner-screen" class="view" style="display:none;">
            <div id="reader" style="width: 100%; min-height: 300px; background: #000;"></div>
            <div id="scanned-result" class="card" style="display:none;">
                <h4 id="food-name">Product</h4>
                <p id="food-info"></p>
                <select id="meal-type">
                    <option value="breakfast">Breakfast</option>
                    <option value="lunch">Lunch</option>
                    <option value="dinner">Dinner</option>
                </select>
                <button id="add-food-btn">Add to Diary</button>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <button onclick="window.showView('dashboard-screen')"><i class="material-icons">home</i></button>
        <button onclick="window.showView('nutrition-screen')"><i class="material-icons">pie_chart</i></button>
        <button id="scan-nav-btn"><i class="material-icons">qr_code_scanner</i></button>
        <button onclick="window.showView('history-screen')"><i class="material-icons">assignment</i></button>
        <button onclick="window.showView('weight-screen')"><i class="material-icons">show_chart</i></button>
        <button onclick="window.showView('profile-screen')"><i class="material-icons">person</i></button>
    </nav>

    <script type="module" src="app.js"></script>
</body>
</html>
