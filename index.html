<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFitnessCustom</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Chart.js for Weight Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- HTML5-QRCode for Barcode Scanning -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

    <!-- App Header -->
    <header>
        <h1 id="view-title">Dashboard</h1>
        <button id="logout-btn" style="display:none;">Logout</button>
    </header>

    <!-- Main Content Area -->
    <main id="app">
        <!-- Auth Screen -->
        <section id="auth-screen" class="view">
            <h2>Welcome</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button id="login-click">Login</button>
            <button id="register-click">Register</button>
        </section>

        <!-- Dashboard / Summary Screen -->
        <section id="dashboard-screen" class="view" style="display:none;">
            <div class="card">
                <h3>Today's Calories</h3>
                <p id="daily-cal-total">0 / 2000</p>
            </div>
            <div class="card">
                <h3>Current Weight</h3>
                <canvas id="weightChart"></canvas>
            </div>
        </section>

        <!-- Barcode Scanner Screen -->
        <section id="scanner-screen" class="view" style="display:none;">
            <div id="reader" style="width: 100%;"></div>
            <div id="scanned-result" class="card" style="display:none;">
                <img id="food-img" src="" alt="food" style="width:50px;">
                <h4 id="food-name">Product Name</h4>
                <p id="food-cals">0 kcal</p>
                <select id="meal-type">
                    <option value="breakfast">Breakfast</option>
                    <option value="lunch">Lunch</option>
                    <option value="dinner">Dinner</option>
                    <option value="snack">Snack</option>
                </select>
                <button id="add-food-btn">Add to Diary</button>
            </div>
        </section>

        <!-- Profile / Social Screen -->
        <section id="profile-screen" class="view" style="display:none;">
            <h3>Privacy Settings</h3>
            <select id="privacy-status">
                <option value="private">Private</option>
                <option value="friends">Friends Only</option>
                <option value="public">Public</option>
            </select>
            <button id="save-profile">Save Profile</button>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button onclick="showView('dashboard-screen')"><i class="material-icons">dashboard</i></button>
        <button onclick="showView('scanner-screen')"><i class="material-icons">qr_code_scanner</i></button>
        <button onclick="showView('profile-screen')"><i class="material-icons">person</i></button>
    </nav>

    <!-- Firebase SDKs -->
    <script type="module" src="app.js"></script>
</body>
</html>
